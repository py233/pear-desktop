name: Build App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: Desktop artifact to build
        required: true
        default: mac-arm64
        type: choice
        options:
          - none
          - mac-arm64
          - windows-x64
          - linux-appimage-x64
          - all

permissions:
  contents: read

env:
  NODE_VERSION: "24.x"
  PNPM_VERSION: "10"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test synced lyrics parser
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: pnpm playwright test src/plugins/synced-lyrics/parsers/lrc.test.ts

      - name: Build
        run: pnpm build

  package-mac-arm64:
    name: Package macOS arm64
    needs: verify
    runs-on: macos-26
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.package == 'mac-arm64' || inputs.package == 'all') }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Show Xcode and actool versions
        run: |
          xcodebuild -version
          xcrun actool --version

      - name: Build macOS arm64 DMG
        run: pnpm dist:mac:arm64

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: pear-desktop-personal-macos-arm64
          path: pack/**/*
          if-no-files-found: error

  package-windows-x64:
    name: Package Windows x64
    needs: verify
    runs-on: windows-latest
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.package == 'windows-x64' || inputs.package == 'all') }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows x64 installer
        run: pnpm dist:win:x64

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: pear-desktop-personal-windows-x64
          path: pack/**/*
          if-no-files-found: error

  package-linux-appimage-x64:
    name: Package Linux AppImage x64
    needs: verify
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.package == 'linux-appimage-x64' || inputs.package == 'all') }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install system packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux AppImage x64
        run: |
          pnpm clean
          pnpm build
          pnpm electron-builder --linux AppImage:x64 -p never

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: pear-desktop-personal-linux-appimage-x64
          path: pack/**/*
          if-no-files-found: error
