name: Build App

on:
  workflow_dispatch:
    inputs:
      package:
        description: Desktop artifact to build
        required: true
        default: mac-arm64
        type: choice
        options:
          - none
          - mac-arm64
          - windows-x64
          - linux-appimage-x64
          - all
      publish_release:
        description: Publish a GitHub Release after building all artifacts
        required: true
        default: false
        type: boolean
      release_tag:
        description: Release tag to publish or replace
        required: false
        default: v3.11.4-personal.4
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.x"
  PNPM_VERSION: "10"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: Typecheck
        run: pnpm typecheck

      - name: Test synced lyrics parser
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: pnpm playwright test src/plugins/synced-lyrics/parsers/lrc.test.ts

      - name: Build
        run: pnpm build

  package-mac-arm64:
    name: Package macOS arm64
    needs: verify
    runs-on: macos-15
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.package == 'mac-arm64' || inputs.package == 'all') }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: Show Xcode and actool versions
        run: |
          xcodebuild -version || true
          xcrun actool --version || true

      - name: Build macOS arm64 DMG
        run: pnpm dist:mac:arm64

      - name: Verify macOS packaged runtime dependencies
        run: node scripts/verify-packaged-runtime.mjs pack/mac-arm64

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: pear-desktop-personal-macos-arm64
          path: |
            pack/*.dmg
            pack/*.dmg.blockmap
            pack/latest-mac.yml
          if-no-files-found: error

  package-windows-x64:
    name: Package Windows x64
    needs: verify
    runs-on: windows-latest
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.package == 'windows-x64' || inputs.package == 'all') }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: Build Windows x64 installer and portable app
        shell: pwsh
        run: |
          pnpm clean
          pnpm build
          Move-Item pnpm-lock.yaml pnpm-lock.yaml.packaging
          try {
            pnpm electron-builder --win nsis:x64 portable:x64 -p never
          } finally {
            Move-Item pnpm-lock.yaml.packaging pnpm-lock.yaml
          }

      - name: Verify Windows packaged runtime dependencies
        run: node scripts/verify-packaged-runtime.mjs pack/win-unpacked

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: pear-desktop-personal-windows-x64
          path: |
            pack/*.exe
            pack/*.exe.blockmap
            pack/latest.yml
          if-no-files-found: error

  package-linux-appimage-x64:
    name: Package Linux AppImage x64
    needs: verify
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.package == 'linux-appimage-x64' || inputs.package == 'all') }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install system packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: Build Linux AppImage x64
        run: |
          pnpm clean
          pnpm build
          pnpm electron-builder --linux AppImage:x64 -p never

      - name: Verify Linux packaged runtime dependencies
        run: node scripts/verify-packaged-runtime.mjs pack/linux-unpacked

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: pear-desktop-personal-linux-appimage-x64
          path: |
            pack/*.AppImage
            pack/*.AppImage.blockmap
            pack/latest-linux.yml
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - package-mac-arm64
      - package-windows-x64
      - package-linux-appimage-x64
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.package == 'all' && inputs.publish_release }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Download packaged artifacts
        uses: actions/download-artifact@v6
        with:
          path: release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          mapfile -d '' ASSETS < <(
            find release-assets -type f \( \
              -name '*.dmg' -o \
              -name '*.dmg.blockmap' -o \
              -name '*.exe' -o \
              -name '*.exe.blockmap' -o \
              -name '*.AppImage' -o \
              -name '*.AppImage.blockmap' -o \
              -name 'latest-*.yml' -o \
              -name 'latest.yml' \
            \) ! -name 'elevate.exe' -print0 | sort -z
          )

          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "No release assets found" >&2
            exit 1
          fi

          APP_VERSION="$(node -p "require('./package.json').version")"
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          {
            echo "Personal build based on ArjixWasTaken/pear-desktop ${APP_VERSION} with bilingual lyrics translation features."
            echo
            echo "Built and published by GitHub Actions from commit \`${GITHUB_SHA}\`."
            echo "Workflow run: ${RUN_URL}"
            echo
            echo "## Changelog"
            echo
            echo "### Translation"
            echo "- Added a current-song-only translation cache clear action. It removes cached translations for the active track from both memory and disk, then lets the selected provider/model translate that song again without wiping the rest of the cache."
            echo "- Added whole-song Google Translate support with local caching, so repeated translation requests do not re-call the provider unnecessarily."
            echo "- Kept translated lines visually tied to their source lyric line, including active/highlight state."
            echo "- Skips translation when the lyric language already matches the target language."
            echo "- Added a small footer below translated lyrics showing the translation source. API providers show the configured model, local CLI providers show their CLI name with auto model selection, and Google Translate/official lyric translations show their provider name."
            echo
            echo "### Lyrics Matching"
            echo "- Improved NetEase matching for producer-prefixed titles and Vocaloid/voicebank fragments, especially Japanese songs where the official title is after the producer name."
            echo "- Added support for LRC timestamps without fractional seconds, including full-width colon timestamps."
            echo "- Uses NetEase official translated lyrics when available, while keeping fallback providers available."
            echo
            echo "### Interface"
            echo "- Scoped synced-lyrics styles to the lyrics container so YouTube Music playlist and library text keeps its normal size."
            echo "- Tuned lyrics font sizing for packaged builds."
            echo "- Fixed translation provider menu persistence, including Google Translate selection."
            echo
            echo "### Packaging"
            echo "- Windows includes both an offline Setup installer and a portable .exe build."
            echo "- Added packaged runtime dependency checks to catch missing app.asar dependencies before release."
            echo "- Releases are created only from the manual GitHub Actions workflow."
            echo
            echo "## Included Artifacts"
            for asset in "${ASSETS[@]}"; do
              echo "- $(basename "$asset")"
            done
            echo
            echo "## Testing Note"
            echo "- I have only tested this build on macOS 15.6.1."
            echo "- Windows and Linux artifacts are generated by GitHub Actions and need user testing."
            echo
            echo "## Notes"
            echo "- This build is unsigned/not notarized. macOS may require removing quarantine with xattr if Gatekeeper blocks it."
            echo "- This is a personal build, not an upstream release or maintained distribution."
          } > release-notes.md

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --yes --cleanup-tag
          fi

          gh release create "$RELEASE_TAG" "${ASSETS[@]}" \
            --target "$GITHUB_SHA" \
            --title "Pear Desktop Personal ${RELEASE_TAG}" \
            --notes-file release-notes.md \
            --latest
